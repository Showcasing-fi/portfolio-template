name: Deploy to Plesk

on:
  workflow_dispatch:

concurrency:
  group: deploy-plesk
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      username: ${{ steps.manifest.outputs.username }}
      deploy_path: ${{ steps.manifest.outputs.deploy_path }}
      output_dir: ${{ steps.manifest.outputs.output_dir }}
      remote_dir: ${{ steps.manifest.outputs.remote_dir }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate manifest and resolve deployment config
        id: manifest
        run: node ./scripts/portfolio-manifest.mjs --github-output --require-real-username

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: ./${{ steps.manifest.outputs.output_dir }}/
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ./${{ needs.validate-and-build.outputs.output_dir }}

      - name: Deploy build output over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ needs.validate-and-build.outputs.remote_dir }}
          local-dir: ./${{ needs.validate-and-build.outputs.output_dir }}/

      - name: Print deployment summary
        run: |
          echo "Validated username: ${{ needs.validate-and-build.outputs.username }}"
          echo "Deployed output directory: ${{ needs.validate-and-build.outputs.output_dir }}"
          echo "Configured public subpath: ${{ needs.validate-and-build.outputs.deploy_path }}"
          echo "Computed jailed FTP target: ${{ needs.validate-and-build.outputs.remote_dir }}"
